name: CI/CD OIEM Abastible - Preprod

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_FRONT: ghcr.io/${{ github.repository }}-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in al GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile.back
          push: true
          tags: ${{ env.IMAGE_API }}:latest

      - name: Build y Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile.front
          push: true
          tags: ${{ env.IMAGE_FRONT }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar docker-compose al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/DOCKERS-PREPROD/ABASTIBLE/"
          overwrite: true

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/DOCKERS-PREPROD/ABASTIBLE
            
            # Login en el registro de GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Actualizar imágenes y reiniciar contenedores
            docker compose pull
            docker compose up -d
            
            # --- Automatización de Base de Datos ---
            echo "Esperando 15 segundos a que MySQL inicie correctamente..."
            sleep 15
            
            echo "Ejecutando Migraciones (Estructura)..."
            # Usamos el flag --env para que Sequelize lea la sección 'preproduction' de tu config
            docker exec oiem_abastible_api npx sequelize-cli db:migrate --env preproduction
            
            echo "Ejecutando Seeders (Datos iniciales y Admin)..."
            docker exec oiem_abastible_api npx sequelize-cli db:seed:all --env preproduction
            
            # Limpieza de imágenes antiguas para ahorrar espacio en disco
            docker image prune -f
            
            echo "🚀 Despliegue de Preproducción finalizado con éxito."
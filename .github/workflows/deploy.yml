version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: oiem_abastible_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  api:
    image: ghcr.io/tu-usuario/abastible-ai-api:latest # LA IMAGEN DE GITHUB
    container_name: oiem_abastible_api
    restart: always
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - db

  frontend:
    image: ghcr.io/tu-usuario/abastible-ai-front:latest # LA IMAGEN DE GITHUB
    container_name: oiem_abastible_front
    restart: always
    ports:
      - "8080:80"
    env_file: .env
    depends_on:
      - api
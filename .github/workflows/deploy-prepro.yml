name: CI/CD OIEM Abastible - Preprod

on:
  push:
    branches: [ "preprod", "UAT-review-1" ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_FRONT: ghcr.io/${{ github.repository }}-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in al GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile.back
          push: true
          tags: ${{ env.IMAGE_API }}:latest-prepro

      - name: Build y Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile.front
          push: true
          tags: ${{ env.IMAGE_FRONT }}:latest-prepro

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar permisos en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Cambiar propietario y permisos si se requiere y usar sudo si es posible
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/DOCKERS-PREPROD/ABASTIBLE/ || true
            sudo chmod -R 775 /home/DOCKERS-PREPROD/ABASTIBLE/ || true
            rm -f /home/DOCKERS-PREPROD/ABASTIBLE/docker-compose-prepro.yml || true

      - name: Copiar docker-compose al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-prepro.yml"
          target: "/home/DOCKERS-PREPROD/ABASTIBLE/"
          overwrite: true

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/DOCKERS-PREPROD/ABASTIBLE
            
            # Login en el registro de GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Actualizar imágenes y reiniciar contenedores de forma forzada
            docker compose -f docker-compose-prepro.yml pull
            docker compose -f docker-compose-prepro.yml up -d --force-recreate
            
            # --- Automatización de Base de Datos ---
            echo "Esperando 15 segundos a que los servicios estabilicen..."
            sleep 15
            
            # Asegurar consistencia del esquema (Añadir columnas faltantes)
            echo "Verificando consistencia del esquema..."
            docker exec prepro_oiem_abastible_api node scripts/ensure_schema.js

            # Eliminar FKs físicas no gestionadas por el código (bloquean la sincronización
            # con OVAL al podar entidades residuales). Se re-verifica en cada deploy.
            echo "Eliminando FKs físicas del esquema..."
            docker exec prepro_oiem_abastible_api node scripts/drop_physical_foreign_keys.js

            # Migración de PK a usu_id (homologación OvalControl). Se ejecuta en cada
            # deploy pero solo aplica cambios la primera vez (guardado en configuraciones).
            echo "Verificando migración de PK a usu_id..."
            docker exec prepro_oiem_abastible_api node scripts/run_usu_id_pk_migration.js

            # Usuarios demo: activar/desactivar según DEMO_USERS_ENABLED en .env del
            # servidor (editar esa línea y volver a desplegar para alternar). No es un
            # "correr una vez": cada deploy reconcilia el estado declarado.
            if grep -qE '^DEMO_USERS_ENABLED=true' .env 2>/dev/null; then
              echo "DEMO_USERS_ENABLED=true: creando/asegurando usuarios demo..."
              docker exec prepro_oiem_abastible_api node scripts/seed_demo_users.js
            else
              echo "DEMO_USERS_ENABLED no es 'true': eliminando usuarios demo (si existen)..."
              docker exec prepro_oiem_abastible_api node scripts/remove_demo_users.js
            fi

            # Limpieza de imágenes antiguas para optimizar espacio
            docker image prune -f
            
            echo "🚀 Sistema prepro desplegado y base de datos actualizada."

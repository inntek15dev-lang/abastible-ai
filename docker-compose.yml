version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: oiem_abastible_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "127.0.0.1:3376:3306" # Puerto externo para gestión (ej. DBeaver)
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - abastible_default

  api:
    image: ghcr.io/inntek15dev-lang/abastible-ai-api:latest
    container_name: oiem_abastible_api
    restart: always
    environment:
      - NODE_ENV=preproduction
      - DB_HOST=db
      - DB_USER=root
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PIZZA_API_URL=${PIZZA_API_URL}
      - PIZZA_API_KEY=${PIZZA_API_KEY}
      - PORT=4077
    # Forzamos la lectura del .env que está en la raíz del servidor
    env_file:
      - .env
    ports:
      - "127.0.0.2:4077:4007"
    depends_on:
      - db
    networks:
      - abastible_default

  frontend:
    image: ghcr.io/inntek15dev-lang/abastible-ai-front:latest
    container_name: oiem_abastible_front
    restart: always
    environment:
      - VITE_API_URL=https://oiem-abastible-api.inntek.cl/api
    ports:
      - "127.0.0.1:8087:80"
    depends_on:
      - api
    networks:
      - abastible_default

networks:
  abastible_default:
    driver: bridge
